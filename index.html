   <!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FGI Decision" />
    <meta name="description" content="Sistema de gerenciamento de obras e apontamento de mão de obra" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carrega a fonte sem bloquear a primeira renderização: o navegador baixa o
         CSS em paralelo (media="print" não é bloqueante) e só aplica quando pronto
         (main.tsx troca media pra 'all' no evento load). Sem isso, a tela ficava
         esperando a resposta de fonts.googleapis.com (uma origem externa) antes de
         mostrar qualquer coisa — pesado em internet de canteiro de obra. noscript
         cobre quem desabilita JS. Sem onload inline por causa da Content-Security-Policy. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>FGI Decision</title>
  </head>
  <body>
    <div id="root" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
